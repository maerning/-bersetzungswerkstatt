header{display:flex;align-items:center;gap:16px;padding:12px 22px;flex-wrap:wrap}
.brand{font-family:Cinzel,Georgia,serif;font-weight:900;color:var(--gold);font-size:22px;letter-spacing:.03em}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.dot{min-width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:rgba(0,0,0,.35);color:var(--cream);font-weight:800;font-size:14px;cursor:pointer;padding:0 6px}
.dot.sec{border-radius:8px;font-family:Cinzel,serif}
.dot.on{background:var(--gold);color:#2a1c10;border-color:var(--gold)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:0 2.5vw;min-height:0}
.card{width:min(1560px,100%);background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:1.8vw 2.6vw 2vw;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:100%;overflow:auto}
.kopf{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:.6vw}
.kopf .zeile{font-family:Cinzel,serif;color:var(--gold);font-size:clamp(14px,1.3vw,22px);letter-spacing:.06em;white-space:nowrap}
.kopf .frage{color:var(--muted);font-size:clamp(13px,1.1vw,19px);text-align:right}
/* Lateinischer Satz */
.latin{font-family:"EB Garamond",Georgia,serif;font-size:clamp(26px,3.1vw,56px);font-weight:500;line-height:1.25;padding-top:.2em;}
.seg{border-radius:10px;padding:.05em .08em;transition:background .3s}
.seg .lbl{display:none}
body.l-ns .seg.ns .w{background:var(--ns);border-bottom:3px solid var(--nsl)}
body.l-ns .seg.aci .w{background:var(--aci);border-bottom:3px solid var(--acil)}
body.l-ns .seg.pc .w{background:var(--pc);border-bottom:3px solid var(--pcl)}
.w{position:relative;display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;cursor:pointer;border-radius:6px;padding:.55em .17em .25em;margin:0;border-radius:0;border-bottom:3px solid transparent;transition:color .25s,background .25s;vertical-align:top}
.w:hover{background:rgba(255,255,255,.08)}
.w.sel{background:rgba(232,184,74,.25)}
/* Satzglied-Schildchen über dem Wort */
.w .tag{display:none;position:absolute;left:50%;transform:translateX(-50%);top:.05em;white-space:nowrap;font-family:"Nunito Sans",sans-serif;font-weight:800;font-size:clamp(10px,.8vw,14px);line-height:1;padding:2px 5px;border-radius:5px;color:#111;margin-bottom:2px}
body.l-pred .w.P .tag,body.l-pred .w.K .tag{display:block;background:var(--pred)}
body.l-subj .w.S .tag{display:block;background:var(--subj)}
body.l-obj .w.OA .tag,body.l-obj .w.OD .tag{display:block;background:var(--obj)}
body.l-obj .w.PN .tag,body.l-obj .w.PR .tag{display:block;background:var(--pn)}
body.l-pred .w.P .wt,body.l-pred .w.K .wt{color:var(--pred);text-decoration:underline 4px;text-underline-offset:.16em}
body.l-subj .w.S .wt{color:var(--subj);text-decoration:underline 4px;text-underline-offset:.16em}
body.l-obj .w.OA .wt,body.l-obj .w.OD .wt{color:var(--obj);text-decoration:underline 4px dashed;text-underline-offset:.16em}
body.l-obj .w.PN .wt,body.l-obj .w.PR .wt{color:var(--pn);text-decoration:underline 4px dotted;text-underline-offset:.16em}
body.l-zeit .w.K .wt{color:var(--konj);text-shadow:0 0 18px rgba(193,140,255,.65)}
body.l-ns .w.E .wt{color:var(--ein);font-weight:700}
/* Hilfen unter dem Wort (gestapelt) */
.w .gls{display:flex;margin-top:.12em;word-spacing:normal;flex-direction:column;align-items:center;gap:3px;pointer-events:none;text-decoration:none}
.w .g{display:none;white-space:nowrap;font-family:"Nunito Sans",sans-serif;font-weight:800;font-size:clamp(11px,.92vw,16px);line-height:1.05;text-decoration:none}
body.l-zeit .w .g.z{display:block;color:#e2c8ff}
body.l-zeit .w.P .g.z{color:#ffb3aa}
body.l-lern .w .g.l{display:block;color:#ffe3a3}
body.l-vok .w .g.v{display:block;color:#cfe3ff}
/* Hinweise */
.notes{display:none;flex-wrap:wrap;gap:10px;margin-top:1.1vw}
body.l-ns .notes{display:flex}
.note{border:1.5px solid var(--nsl);border-radius:12px;padding:6px 12px;font-size:clamp(13px,1.05vw,19px);background:rgba(20,30,50,.6)}
.note b{color:var(--ein)}
.tipps{margin-top:1vw;display:flex;flex-wrap:wrap;gap:10px}
.tipp{border:1.5px dashed var(--line);border-radius:12px;padding:6px 12px;font-size:clamp(13px,1.05vw,19px);color:var(--muted)}
.tipp b{color:var(--gold)}
/* Werkzeuge */
footer{display:flex;align-items:center;gap:8px;padding:10px 22px 14px;flex-wrap:wrap}
.tool{border:2px solid var(--line);background:rgba(10,12,18,.82);color:var(--cream);border-radius:12px;padding:8px 12px;font-weight:800;font-size:clamp(12px,.95vw,17px);cursor:pointer;display:flex;align-items:center;gap:7px}
.tool i{font-style:normal;width:13px;height:13px;border-radius:50%;display:inline-block}
.tool.on{border-color:var(--gold);background:rgba(232,184,74,.2)}
.tool.small{font-size:clamp(11px,.85vw,15px)}
.nav{margin-left:auto;display:flex;gap:10px}
.nav button{font-size:22px;width:54px;height:46px;border-radius:12px;border:2px solid var(--line);background:rgba(10,12,18,.8);color:var(--cream);cursor:pointer}
/* Popup */
.pop{position:fixed;z-index:20;max-width:380px;background:#14161e;border:2px solid var(--gold);border-radius:14px;padding:12px 16px;box-shadow:0 12px 40px rgba(0,0,0,.6);font-size:18px;display:none}
.pop .lw{font-family:"EB Garamond",serif;font-size:30px;color:var(--gold);font-weight:700;line-height:1.1}
.pop table{border-collapse:collapse;margin-top:6px}
.pop td{padding:3px 8px 3px 0;vertical-align:top;line-height:1.3}
.pop td:first-child{color:var(--muted);font-size:14px;white-space:nowrap;padding-top:5px}
/* Start- und Abschnittsfolien */
.big{text-align:center}
.big h1{font-family:Cinzel,serif;font-weight:900;color:var(--gold);font-size:clamp(34px,5vw,90px);margin:.1em 0;text-shadow:0 4px 0 #3b0a0e}
.big .sub{font-size:clamp(17px,1.7vw,28px);color:var(--muted)}
.big .q{font-family:"EB Garamond",serif;font-style:italic;font-size:clamp(24px,2.8vw,50px);margin:.5em auto .3em;max-width:24em;line-height:1.25}
.hero{display:flex;align-items:center;gap:3vw}
.hero img{height:min(50vh,500px);filter:drop-shadow(0 12px 24px rgba(0,0,0,.6))}
.secno{font-family:Cinzel,serif;color:var(--gold);font-size:clamp(15px,1.35vw,23px);letter-spacing:.12em}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:1.2vw;text-align:left}
.plan div{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-size:clamp(14px,1.15vw,20px);background:rgba(0,0,0,.25)}
.plan b{font-family:Cinzel,serif;color:var(--gold);margin-right:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin-top:1vw;font-size:clamp(12px,1vw,17px);color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
@media (max-width:760px){.hero{flex-direction:column}.hero img{height:200px}.plan{grid-template-columns:1fr}}
</style>

      <div class="big" style="text-align:left"><div class="secno">LEKTION 20 · Z. 4–13</div>
      <h1 style="margin:.1em 0">Calgacus spricht</h1>
      <div class="sub">Deine Übersetzungshilfe – du übersetzt, die Werkstatt hilft.</div>
      <div class="plan">
        <div><b>1</b>Prädikat finden: Person, Zeit, Modus</div>
        <div><b>2</b>Subjekt suchen – oder steckt es im Prädikat?</div>
        <div><b>3</b>Objekte und Ergänzungen</div>
        <div><b>4</b>Gliedsätze, AcI und PC abgrenzen</div>
        <div><b>5</b>Lernform und Bedeutung klären</div>
        <div><b>6</b>Satz zusammensetzen und prüfen</div>
      </div>
      <div class="hint" style="margin-top:1vw;color:var(--muted)">Tasten 1–7 schalten die Hilfen ein · Wort antippen = alle Infos zum Wort · Pfeiltasten = blättern</div></div></div>`;
  } else if(s.typ==='sec'){
    card.innerHTML = `<div class="big"><div class="secno">ABSCHNITT ${s.nr} · ${s.zeilen}</div><h1>${s.titel}</h1>
      <div class="q">${s.frage}</div><div class="sub">Behalte die Leitfrage beim Übersetzen im Kopf.</div></div>`;
  } else if(s.typ==='final'){
    card.innerHTML = `<div class="big"><div class="secno">ZUM SCHLUSS</div><h1>Wer hat recht?</h1>
      <div class="q">Rom sagt: <i>pāx</i>. Calgacus sagt: <i>sōlitūdō</i>.<br>Und du?</div>
      <div class="sub">Begründe deine Meinung mit einem lateinischen Ausdruck aus dem Text.</div></div>`;
  } else {
    const sec = S.find(x=>x.typ==='sec'&&x.nr===s.f);
    let html='';
    s.seg.forEach(g=>{
      html += `<span class="seg ${g.k||''}" title="${g.lbl?esc(g.lbl):''}">` + g.w.map(([t,role,lf,bed,form])=>{
        const roles = role.split(' ').filter(Boolean), main = roles.find(r=>r!=='E');
        const isPred = main==='P'||main==='K';
        const gls = [isPred?`<span class="g z">${esc(kurzForm(form))}</span>`:'', lf?`<span class="g l">${esc(kurzLern(lf))}</span>`:'', bed?`<span class="g v">${esc(bed)}</span>`:''].join('');
        return `<span class="w ${roles.join(' ')}" data-t="${esc(t.replace(/[.,:;]$/,''))}" data-lf="${esc(lf)}" data-b="${esc(bed)}" data-f="${esc(form)}" data-r="${esc(main?TAG[main]:'')}">${main&&TAG[main]?`<span class="tag">${TAG[main]}</span>`:''}<span class="wt">${esc(t)}</span><span class="gls">${gls}</span></span>`;
      }).join('') + `</span>`;
    });
    const lbls = s.seg.filter(g=>g.k).map(g=>`<div class="note" style="border-color:var(--${g.k==='ns'?'nsl':g.k==='aci'?'acil':'pcl'})"><b>${g.lbl}</b>: ${esc(g.w.map(w=>w[0]).join(' ').replace(/[.,:;]$/,''))}</div>`).join('');
    const notes = `<div class="notes">${lbls}${(s.notes||[]).map(n=>`<div class="note">${n}</div>`).join('')}</div>`;
    const tipps = s.tipps ? `<div class="tipps">${s.tipps.map(t=>`<div class="tipp">💡 ${t}</div>`).join('')}</div>` : '';
    card.innerHTML = `<div class="kopf"><div class="zeile">${s.z}</div><div class="frage">${sec?'Leitfrage: '+sec.frage:''}</div></div>
      <div class="latin">${html}</div>${notes}${tipps}`;
    card.querySelectorAll('.w').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();showPop(el)}));
  }
  [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));
}
function showPop(el){
  card.querySelectorAll('.w.sel').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
  const d = el.dataset, rows = [['Lernform',d.lf],['Bedeutung',d.b],['Form',d.f],['Satzglied',d.r]].filter(r=>r[1]);
  pop.innerHTML = `<div class="lw">${d.t}</div><table>${rows.map(([a,b])=>`<tr><td>${a}</td><td>${esc(b)}</td></tr>`).join('')}</table>`;
  pop.style.display='block';
  const r = el.getBoundingClientRect(), pw = pop.offsetWidth;
  pop.style.left = Math.max(10,Math.min(innerWidth-pw-10, r.left + r.width/2 - pw/2))+'px';
  pop.style.top = (r.top - pop.offsetHeight - 14 > 10 ? r.top - pop.offsetHeight - 14 : r.bottom + 14)+'px';
}
document.addEventListener('click',()=>{pop.style.display='none';card.querySelectorAll('.w.sel').forEach(x=>x.classList.remove('sel'))});

function setLayer(l,on){
  on ? layers.add(l) : layers.delete(l);
  document.body.classList.toggle('l-'+l,on);
  document.querySelector(`.tool[data-l="${l}"]`).classList.toggle('on',on);
  const n = ['zeit','lern','vok'].filter(x=>layers.has(x)).length;
  document.documentElement.style.setProperty('--gl', n);
}
S.forEach((s,k)=>{const b=document.createElement('button');b.className='dot'+(s.typ==='sec'?' sec':'');
  b.textContent = s.typ==='start'?'★':s.typ==='final'?'?':s.typ==='sec'?s.nr:String(S.slice(0,k+1).filter(x=>!x.typ).length);
  b.onclick=e=>{e.stopPropagation();go(k)};dots.appendChild(b)});
function go(k){i=Math.max(0,Math.min(S.length-1,k));render()}
document.getElementById('prev').onclick=e=>{e.stopPropagation();go(i-1)};
document.getElementById('next').onclick=e=>{e.stopPropagation();go(i+1)};
document.querySelectorAll('.tool[data-l]').forEach(b=>b.onclick=e=>{e.stopPropagation();setLayer(b.dataset.l,!layers.has(b.dataset.l))});
document.getElementById('alle').onclick=e=>{e.stopPropagation();[...layers].forEach(l=>setLayer(l,false))};
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(i+1)}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1)}
  const n={'1':'pred','2':'zeit','3':'subj','4':'obj','5':'ns','6':'lern','7':'vok'}[e.key];
  if(n) setLayer(n,!layers.has(n));
  if(e.key==='0') [...layers].forEach(l=>setLayer(l,false));
});
render();
</script>
</body>
</html>
